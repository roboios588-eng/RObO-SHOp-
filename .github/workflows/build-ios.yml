name: Build iOS App
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Build iOS App and IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          brew install xcodegen
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "ROBO SHOP.xcodeproj" \
            -scheme "ROBOSHOP" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/Build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Build/Products/Release-iphoneos/ROBOSHOP.app"
          IPA_DIR="$GITHUB_WORKSPACE/build/ipa"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/build/Build" \
              -type d -name "ROBOSHOP.app" -print -quit)
          fi
          if [ -z "${APP_PATH:-}" ] || [ ! -d "$APP_PATH" ]; then
            echo "App build output was not found."
            exit 1
          fi
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/ROBOSHOP.app"
          cd "$IPA_DIR"
          /usr/bin/zip -qry ROBOSHOP.ipa Payload
          echo "IPA created successfully:"
          ls -lh ROBOSHOP.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ROBOSHOP-iOS-IPA
          path: build/ipa/ROBOSHOP.ipa
          if-no-files-found: error
          retention-days: 14