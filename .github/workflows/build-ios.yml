
name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App and IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          find "$GITHUB_WORKSPACE" -maxdepth 4 -name '*.xcodeproj' -print

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo '::error::No Xcode project found after XcodeGen.'
            exit 1
          fi

          xcodebuild -list -json -project "$PROJECT_PATH" > "$RUNNER_TEMP/xcode-list.json"

          SCHEME="$(python3 - "$RUNNER_TEMP/xcode-list.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              data = json.load(file)

          schemes = data.get("project", {}).get("schemes", [])

          for preferred in ("ROBOSHOP", "ROBO SHOP"):
              if preferred in schemes:
                  print(preferred)
                  raise SystemExit(0)

          if schemes:
              print(schemes[0])
          else:
              raise SystemExit("No Xcode scheme found")
          PY
          )"

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData" -type d -name '*.app' -path '*/Release-iphoneos/*' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo '::error::Built iOS app was not found.'
            find "$GITHUB_WORKSPACE/build/DerivedData" -maxdepth 7 -print || true
            exit 1
          fi

          IPA_DIR="$GITHUB_WORKSPACE/build/ipa"
          mkdir -p "$IPA_DIR/Payload"

          ditto "$APP_PATH" "$IPA_DIR/Payload/$(basename "$APP_PATH")"

          cd "$IPA_DIR"
          /usr/bin/zip -qry ROBOSHOP.ipa Payload
          ls -lh ROBOSHOP.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROBOSHOP-iOS-IPA
          path: build/ipa/ROBOSHOP.ipa
          if-no-files-found: error
          retention-days: 14
